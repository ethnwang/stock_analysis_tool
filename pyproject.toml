[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "stockbot"
version = "0.1.0"
description = "Stock analysis bot with technical, fundamental, and sentiment scoring"
requires-python = ">=3.10"
dependencies = [
    "yahooquery>=2.4.1",
    "pandas>=2.0",
    "numpy>=1.24",
    "ta>=0.11.0",
    "finnhub-python>=2.4.19",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "schwab-trader>=1.2.0",
    "plaid-python>=39.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
# FinBERT sentiment backend (~2GB torch + ~440MB model download). On WSL,
# install CPU-only torch first to skip CUDA:
#   pip3 install torch --index-url https://download.pytorch.org/whl/cpu
finbert = [
    "torch>=2.0",
    "transformers>=4.35",
]

[project.scripts]
stockbot = "main:main"
